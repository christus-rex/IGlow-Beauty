<g transform="translate(72 330)"><rect width="500" height="328" rx="36" fill="#fff" stroke="#c8a24a" stroke-opacity=".35"/><text x="40" y="66" font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="#a77b22">FROM THE SUPPLIED WALKTHROUGH</text><text x="40" y="120" font-family="Georgia,serif" font-size="37" font-weight="700" fill="#2b2027">Clean. Comfortable. Intentional.</text><text x="40" y="170" font-family="Arial,sans-serif" font-size="22" fill="#665962">Soft seating, glass treatment-room partitions,</text><text x="40" y="206" font-family="Arial,sans-serif" font-size="22" fill="#665962">white architectural details and warm metallic accents</text><text x="40" y="242" font-family="Arial,sans-serif" font-size="22" fill="#665962">create a calm first impression for every visit.</text><rect x="40" y="272" width="220" height="36" rx="18" fill="#f7e8ef"/><text x="150" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#8f4f70">STUDIO VIDEO ARCHIVE</text></g>
