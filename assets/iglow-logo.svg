<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">iGlow Beauty Bar</title>
  <desc id="desc">Transparent gold, pink, silver and white iGlow Beauty Bar logo with a feminine profile, crown, lashes and glow accents.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9d6b16"/>
      <stop offset=".28" stop-color="#f5d87b"/>
      <stop offset=".55" stop-color="#c8a24a"/>
      <stop offset=".8" stop-color="#fff1ad"/>
      <stop offset="1" stop-color="#a56e14"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" x2="1">
      <stop offset="0" stop-color="#f7c8da"/>
      <stop offset=".5" stop-color="#dfa0bb"/>
      <stop offset="1" stop-color="#c86f9b"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#c7cbd1"/>
      <stop offset=".7" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#9da3ab"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7c4560" flood-opacity=".16"/>
    </filter>
  </defs>

