    <circle cx="132" cy="134" r="104" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path d="M59 116c12-43 44-68 79-70 28-2 52 10 70 30-28-13-58-15-80-3-22 12-35 36-35 61 0 31 18 58 47 72-35-3-64-25-76-55-5-11-7-23-5-35Z" fill="none" stroke="url(#pink)" stroke-width="7" stroke-linecap="round"/>
    <path d="M100 118c12 4 23 4 34 0-8 11-24 14-34 0Z" fill="#2a2026"/>
    <path d="M98 115c11-8 25-9 38-1" fill="none" stroke="#2a2026" stroke-width="4" stroke-linecap="round"/>
    <path d="M103 119l-8 7m14-5-5 9m12-8-2 10m10-11 3 9m5-11 7 7" stroke="#2a2026" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M98 161c8 7 16 8 24 1" fill="none" stroke="#d77fa6" stroke-width="5" stroke-linecap="round"/>
    <path d="M91 68l14-29 19 16 15-27 18 28 22-16 10 29" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="105" cy="39" r="4" fill="#dfa0bb"/><circle cx="139" cy="28" r="4" fill="#ffffff" stroke="#c8a24a" stroke-width="2"/><circle cx="179" cy="40" r="4" fill="#dfa0bb"/>
    <path d="M204 42l5 13 13 5-13 5-5 13-5-13-13-5 13-5 5-13Z" fill="url(#gold)"/>
