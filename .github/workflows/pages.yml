name: Deploy iGlow Beauty to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify BA-001 high-resolution assets
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = (1152, 1536)
          paths = [
              Path('assets/transformations/ba-001-before-hq.webp'),
              Path('assets/transformations/ba-001-after-hq.webp'),
          ]
          for path in paths:
              if not path.exists():
                  raise SystemExit(f'Missing required high-resolution asset: {path}')
              with Image.open(path) as image:
                  if image.size != expected:
                      raise SystemExit(f'{path}: expected {expected[0]}x{expected[1]}, got {image.size[0]}x{image.size[1]}')
                  print(f'{path}: verified {image.size[0]}x{image.size[1]}, {path.stat().st_size:,} bytes')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
