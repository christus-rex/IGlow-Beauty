name: Deploy iGlow Beauty to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify published customer media fidelity
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          import hashlib
          import io
          import json
          import re
          import urllib.request
          from pathlib import Path
          from PIL import Image

          catalog_path = Path('data/transformations.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          checked = 0

          for item in catalog.get('transformations', []):
              if not (item.get('consent_confirmed') is True and item.get('publication_authorized') is True):
                  continue

              item_id = item.get('id', 'unknown')
              declared = str(item.get('published_resolution') or item.get('source_resolution') or '').strip()
              match = re.fullmatch(r'(\d+)[xX](\d+)', declared)
              if not match:
                  raise SystemExit(f'{item_id}: missing or invalid published/source resolution; refusing to publish unverifiable customer media.')

              expected = (int(match.group(1)), int(match.group(2)))
              for field in ('before_image', 'after_image'):
                  ref = item.get(field)
                  if not ref:
                      raise SystemExit(f'{item_id}: missing {field}.')

                  if ref.startswith(('http://', 'https://')):
                      request = urllib.request.Request(ref, headers={'User-Agent': 'iGlow-media-fidelity-check/1.0'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = response.read()
                      with Image.open(io.BytesIO(payload)) as image:
                          image.load()
                          actual = image.size
                      label = ref
                      size = len(payload)
                      digest = hashlib.sha256(payload).hexdigest()[:16]
                  else:
                      path = Path(ref.removeprefix('./'))
                      if not path.is_file():
                          raise SystemExit(f'{item_id}: missing customer image {path}.')
                      payload = path.read_bytes()
                      with Image.open(io.BytesIO(payload)) as image:
                          image.load()
                          actual = image.size
                      label = str(path)
                      size = len(payload)
                      digest = hashlib.sha256(payload).hexdigest()[:16]

                  if actual != expected:
                      raise SystemExit(
                          f'{item_id}: {label} expected {expected[0]}x{expected[1]}, got {actual[0]}x{actual[1]}; '
                          'refusing to resize, upscale, recompress, or publish a lower-resolution substitute.'
                      )

                  print(f'{item_id}: {field} verified {actual[0]}x{actual[1]} • sha256 {digest} • {size:,} bytes • {label}')
                  checked += 1

          print(f'Customer media fidelity check passed for {checked} published image(s). No image files were modified.')
          PY

      - name: Build downloadable showcase MP4 slideshows
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          python scripts/build_showcase_videos.py
          find assets/videos -maxdepth 1 -type f -name '*.mp4' -print -exec ls -lh {} \;

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
