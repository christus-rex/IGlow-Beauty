name: Deploy iGlow Beauty to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify published customer media fidelity
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          from PIL import Image

          catalog_path = Path('data/transformations.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          checked = 0

          for item in catalog.get('transformations', []):
              if not (item.get('consent_confirmed') is True and item.get('publication_authorized') is True):
                  continue

              item_id = item.get('id', 'unknown')
              declared = str(item.get('source_resolution') or '').strip()
              match = re.fullmatch(r'(\d+)[xX](\d+)', declared)
              if not match:
                  raise SystemExit(f'{item_id}: missing or invalid source_resolution; refusing to publish unverifiable customer media.')

              expected = (int(match.group(1)), int(match.group(2)))
              for field in ('before_image', 'after_image'):
                  ref = item.get(field)
                  if not ref:
                      raise SystemExit(f'{item_id}: missing {field}.')
                  if ref.startswith(('http://', 'https://')):
                      raise SystemExit(f'{item_id}: {field} must be a repository-hosted original so fidelity can be verified.')

                  path = Path(ref.removeprefix('./'))
                  if not path.is_file():
                      raise SystemExit(f'{item_id}: missing customer image {path}.')

                  with Image.open(path) as image:
                      image.load()
                      actual = image.size
                  if actual != expected:
                      raise SystemExit(
                          f'{item_id}: {path} expected {expected[0]}x{expected[1]}, got {actual[0]}x{actual[1]}; '
                          'refusing to resize, upscale, recompress, or publish a lower-resolution substitute.'
                      )

                  digest = hashlib.sha256(path.read_bytes()).hexdigest()[:16]
                  print(f'{item_id}: {field} verified {actual[0]}x{actual[1]} • sha256 {digest} • {path.stat().st_size:,} bytes')
                  checked += 1

          print(f'Customer media fidelity check passed for {checked} published image(s). No image files were modified.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
