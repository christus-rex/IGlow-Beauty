name: Deploy iGlow Beauty to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore BA-001 from high-resolution masters
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          mkdir -p /tmp/iglow-masters

          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          sources = {
              'before': '1hqDa2wLXvpOItbnDBPLb1jZaj7pNAFg7',
              'after': '1y0skPUFgR5VITDYPW9qJVCVLdlAZldoJ',
          }
          expected = (1152, 1536)

          def candidates(file_id):
              return [
                  f'https://drive.google.com/thumbnail?id={file_id}&sz=w1600',
                  f'https://lh3.googleusercontent.com/d/{file_id}=w1600',
                  f'https://drive.google.com/uc?export=view&id={file_id}',
                  f'https://drive.google.com/uc?export=download&id={file_id}',
              ]

          for label, file_id in sources.items():
              source = Path(f'/tmp/iglow-masters/ba-001-{label}.img')
              image = None
              for url in candidates(file_id):
                  try:
                      request = Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      data = urlopen(request, timeout=30).read()
                      source.write_bytes(data)
                      with Image.open(source) as test:
                          test.load()
                          candidate = ImageOps.exif_transpose(test).convert('RGB')
                      print(f'{label}: candidate {url} -> {candidate.size[0]}x{candidate.size[1]}, {len(data):,} bytes')
                      if candidate.size == expected:
                          image = candidate
                          break
                  except Exception as exc:
                      print(f'{label}: candidate failed {url}: {exc}')
              if image is None:
                  raise SystemExit(f'{label}: no unauthenticated Google image endpoint returned the verified {expected[0]}x{expected[1]} master.')
              target = Path(f'assets/transformations/ba-001-{label}.webp')
              image.save(target, 'WEBP', quality=96, method=6)
              print(f'{target}: verified master {image.size[0]}x{image.size[1]}, output {target.stat().st_size:,} bytes')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
