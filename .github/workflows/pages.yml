name: Deploy iGlow Beauty to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore BA-001 from high-resolution masters
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          mkdir -p /tmp/iglow-masters

          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/iglow-masters/ba-001-before.jpg \
            "https://drive.usercontent.google.com/download?id=1hqDa2wLXvpOItbnDBPLb1jZaj7pNAFg7&export=download&confirm=t"

          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/iglow-masters/ba-001-after.jpg \
            "https://drive.usercontent.google.com/download?id=1y0skPUFgR5VITDYPW9qJVCVLdlAZldoJ&export=download&confirm=t"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          pairs = [
              (Path('/tmp/iglow-masters/ba-001-before.jpg'), Path('assets/transformations/ba-001-before.webp')),
              (Path('/tmp/iglow-masters/ba-001-after.jpg'), Path('assets/transformations/ba-001-after.webp')),
          ]

          expected = (1152, 1536)
          for source, target in pairs:
              with Image.open(source) as image:
                  image = ImageOps.exif_transpose(image).convert('RGB')
                  if image.size != expected:
                      raise SystemExit(f'{source.name}: expected {expected[0]}x{expected[1]}, received {image.size[0]}x{image.size[1]}; refusing to upscale a low-resolution source.')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  image.save(target, 'WEBP', quality=96, method=6)
                  print(f'{target}: source {image.size[0]}x{image.size[1]}, output {target.stat().st_size:,} bytes')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
